# YOLO11 + DSDAM (Deformable Spatial Dual-Attention Module) for infrared small target detection.
# Scheme A: insert one DSDAM after each of backbone P3 / P4 / P5 feature stages.
#
# Ablation switch (use_dsdam):
#   - DSDAM args = [out_ch, r, num_heads, window_size, use_dsdam]
#   - Set the last arg to True  -> full DSDAM (deformable conv + windowed self-attention)
#   - Set the last arg to False -> DSDAM degenerates to a 1x1 channel-projection shortcut
#     (no enhancement, keeps channel dim consistent for fair comparison)
#   - For a clean baseline without any DSDAM layer, use the original yolo11.yaml instead.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n-DSDAM backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, DSDAM, [512, 2, 4, 8, True]] # 5 (P3-DSDAM)  <- flip last arg to False for ablation
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, DSDAM, [512, 2, 4, 8, True]] # 8 (P4-DSDAM)  <- flip last arg to False for ablation
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10
  - [-1, 1, DSDAM, [1024, 2, 4, 8, True]] # 11 (P5-DSDAM)  <- flip last arg to False for ablation
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 2, C2PSA, [1024]] # 13

# YOLO11n-DSDAM head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]] # cat backbone P4-DSDAM (layer 8)
  - [-1, 2, C3k2, [512, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3-DSDAM (layer 5)
  - [-1, 2, C3k2, [256, False]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P5 (C2PSA layer 13)
  - [-1, 2, C3k2, [1024, True]] # 25 (P5/32-large)

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
