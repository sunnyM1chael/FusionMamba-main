# YOLO11 Energy-Guided Scale-Selective DSDAM Head (ESSD-Head)

nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# DSDAM args: [out_channels, sampling_ratio, heads, window, enabled, energy_guided]
# Dense sampling is reserved for high-resolution P2/P3 features; P4 supplies context.
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2
  - [-1, 1, DSDAM, [256, 1, 4, 8, True, True]] # 3-P2 energy-guided
  - [-1, 1, Conv, [256, 3, 2]]                 # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 5
  - [-1, 1, DSDAM, [512, 1, 4, 8, True, True]] # 6-P3 energy-guided
  - [-1, 1, Conv, [512, 3, 2]]                 # 7-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 8
  - [-1, 1, DSDAM, [512, 2, 4, 8, True, True]] # 9-P4 contextual
  - [-1, 1, Conv, [1024, 3, 2]]                # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 11
  - [-1, 1, SPPF, [1024, 5]]                   # 12
  - [-1, 2, C2PSA, [1024]]                     # 13

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                # 16-P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                # 19-P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]                # 22-P2/4 extra-small

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                # 25-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                # 28-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                # 31-P5/32

  - [[22, 25, 28, 31], 1, Detect, [nc]]
